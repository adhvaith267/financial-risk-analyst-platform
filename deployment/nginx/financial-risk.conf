limit_req_zone $binary_remote_addr zone=riskora_api:10m rate=10r/s;

server {
    listen 80;
    server_name riskora.online www.riskora.online;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name riskora.online www.riskora.online;

    ssl_certificate     /etc/letsencrypt/live/riskora.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riskora.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── React SPA ──────────────────────────────────────────────────────────────
    root /var/www/financial-risk-analyst/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── FastAPI backend (reverse proxy) ────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        client_max_body_size 1m;
        limit_req          zone=riskora_api burst=20 nodelay;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;

        proxy_read_timeout  180s;
        proxy_send_timeout  180s;
        proxy_connect_timeout 10s;
    }

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/fra-access.log;
    error_log  /var/log/nginx/fra-error.log;
}
