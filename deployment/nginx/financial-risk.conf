server {
    listen 80 default_server;
    server_name _;          # catch-all — replace with your domain if you have one

    # ── React SPA ──────────────────────────────────────────────────────────────
    root /var/www/financial-risk-analyst/frontend/dist;
    index index.html;

    # SPA fallback: any path that is not a real file falls through to index.html
    # so React Router handles the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── FastAPI backend (reverse proxy) ────────────────────────────────────────
    # Nginx strips the /api prefix before forwarding to FastAPI. FastAPI is
    # bound to 127.0.0.1:8000 and NOT exposed publicly.
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow longer responses for agent/ask calls (LLM can take 30–120s).
        proxy_read_timeout  180s;
        proxy_send_timeout  180s;
        proxy_connect_timeout 10s;
    }

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header X-XSS-Protection        "1; mode=block";

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/fra-access.log;
    error_log  /var/log/nginx/fra-error.log;
}
