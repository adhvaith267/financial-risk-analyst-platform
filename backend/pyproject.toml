[project]
name = "financial-risk-analyst-backend"
version = "0.1.0"
description = "FastAPI backend, credit/market/stress risk engines, and LangGraph agent for the AI-Powered Financial Risk Analyst platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.14",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-aws>=0.2",
    "PyJWT[crypto]>=2.9",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
